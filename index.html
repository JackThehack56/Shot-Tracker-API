<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="public/images/logo.png" type="image/png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Python Shot Tracker</title>
    <style>
        body {
            background-color: hsl(0, 0%, 10%);

            display: flex;
            justify-content: center;

            text-align: center;
            height: 100vh;
            font-family: 'Courier New', Courier, monospace;
            font-weight: 900;
            color: white;
        }

        label {
            font-size: 1.2em;
        }

        input, select {
            box-sizing: border-box;
            display: block;
            width: 70%;
            height: 40px;
            padding: 5px;
            border: none;
            border-radius: 5px;
            margin: 10px auto 10px auto;
        }

        form {
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
            align-items: center;

            width: 400px;
            height: auto;
            padding: 30px;
            background-color: hsla(0, 0%, 100%, 0.1);
            border: hsla(0, 0%, 100%, 0.3) 4px solid;
            border-radius: 10px;
        }

        .sandf {
            border: hsla(0, 0%, 0%, 0.5) solid;
            width: 70%;
            border-radius: 10px;
            margin: 10px 0 0px 0;
        }

        input[type="submit"] {
            width: 70%;
            height: 50px;
            background: linear-gradient(135deg, hsl(120, 100%, 70%), hsl(120, 100%, 50%));
            border: 2px hsla(0, 0%, 0%, 0.5) solid;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.5em;
            cursor: pointer;
        }

        input[type="submit"]:active {
            background: linear-gradient(135deg, hsl(120, 100%, 60%), hsl(120, 100%, 40%));
            cursor: pointer;
        }

        #save {
            width: 35%;
            height: 50px;
            background: linear-gradient(135deg, hsl(226, 100%, 70%), hsl(226, 100%, 50%));
            border: 2px hsla(0, 0%, 0%, 0.5) solid;
            border-radius: 12px;
            font-weight: 900;
            font-size: 1.5em;
            cursor: pointer;
        }

        #save:active {
            background: linear-gradient(135deg, hsl(226, 100%, 60%), hsl(226, 100%, 40%));
        }

        #output {
            font-size: 1.8em;
            white-space: pre-wrap;

            max-height: 300px;
            overflow: scroll;
            scrollbar-width: none;
            margin-top: 20px;
        }

        @media (width < 505px) {
            body {
                display: block;
                text-align: center;
            }

            input, select {
                width: 80%;
            }

            form {
                width: 100%;
                padding: 0;
                border: none;
                background: none;
            }

            .sandf {
                width: 80%;
                border: hsla(0, 0%, 100%, 0.5) solid;
            }

            #hole, #stroke, #club, #category {
                height: 40px;
            }
        }
    </style>
</head>
<body>
    
    <div id="wrapper">
        <form onsubmit="sendData(event)">
            <h1>Shot Tracker</h1>

            <label for="hole">Hole</label>
            <input type="number" name="hole" id="hole" value="1" placeholder="Hole..">
            <label for="stroke">Stroke</label>
            <input type="number" name="stroke" id="stroke" value="1" placeholder="Stroke...">
            <label for="club">Club</label> 
            <select name="club" id="club">
                <option value="putter">Putter</option>
                <option value="driver" selected>Driver</option>
                <option value="4-wood">4 Wood</option>
                <option value="7-wood">7 Wood</option>
                <option value="hybrid">Hybrid</option>
                <option value="5-iron">5 Iron</option>
                <option value="6-iron">6 Iron</option>
                <option value="7-iron">7 Iron</option>
                <option value="8-iron">8 Iron</option>
                <option value="9-iron">9 Iron</option>
                <option value="p-wedge">Pitching Wedge</option>
                <option value="g-wedge">48° Wedge</option>
                <option value="l-wedge">58° Wedge</option>
            </select>
            <label for="category">Category</label>
            <select name="category" id="category">
                <option value="tee">Tee Box</option>
                <option value="approach">Approach Shot</option>
                <option value="atg">Around the Green</option>
                <option value="putting">Putting</option>
            </select>
            <div class="sandf">
                <h2>Start</h2>
                <select name="lie1" id="lie1"> <!-- This'll have to be converted back to proper format to be displayed -->
                    <option value="t">Tee</option>
                    <option value="f">Fairway</option>
                    <option value="r">Rough</option>
                    <option value="s">Sand</option>
                    <option value="rc">Recovery</option>
                    <option value="g">Green</option>
                    <option value="h">Hole</option>
                </select> 
                <input type="number" name="distance1" id="distance1" placeholder="135">
            </div>
            <div class="sandf">
                <h2>Finish</h2>
                <select name="lie2" id="lie2">
                    <option value="t">Tee</option>
                    <option value="f" selected>Fairway</option>
                    <option value="r">Rough</option>
                    <option value="s">Sand</option>
                    <option value="rc">Recovery</option>
                    <option value="g">Green</option>
                    <option value="h">Hole</option>
                </select>
                <input type="number" name="distance2" id="distance2" placeholder="19">
            </div>
            <input type="submit" value="Submit">
            <pre id="output"></pre>
        </form>
    </div>

    <script type="module" src="src/lib/data.js"></script>
    <script src="src/main.js"></script>
</body>
</html>
